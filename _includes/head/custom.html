<style>
  /* Sample excerpts on writing sample pages */

  /* Home page: opening statement next to the photo */
  .home-hero__lead { font-size: 1.1em; font-weight: 600; }

  .fiverr-reviews__item footer span { color: #f5a623; letter-spacing: 1px; }

  .packages { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 1.25em; margin: 2em 0; align-items: stretch; }

  .work-paths .stars { color: #f5a623; letter-spacing: 1px; }

  a.btn.btn--fiverr, a.btn.btn--fiverr:visited { background: #1dbf73; border-color: #1dbf73; color: #fff !important; text-decoration: none; }
  a.btn.btn--fiverr:hover { background: #19a463; border-color: #19a463; color: #fff !important; }

  .author__urls li.sidebar-hire { white-space: normal; max-width: 100%; }

  .sidebar-hire__rating span { color: #f5a623; letter-spacing: 1px; }

  /* Contact page: two routes */
  .contact-routes { display: grid; gap: 1.25em; margin: 1.5em 0 2em; }
  .contact-route { padding: 1.25em 1.5em; border: 1px solid #e6e6e6; border-radius: 6px; }

  .pill-row, .work-paths .package__cta { display: flex; flex-wrap: wrap; gap: 0.6em; }
  a.pill { display: inline-flex; align-items: center; gap: 0.5em; padding: 0.6em 1.15em; border: 1px solid #d5dadd; border-radius: 4px; background: #fff; color: #3d4144; font-size: 0.85rem; font-weight: 600; text-decoration: none; transition: background 0.15s, border-color 0.15s, transform 0.15s; }
  a.pill:hover { background: #f4f6f7; border-color: #b9c0c4; transform: translateY(-1px); }

  a.pill--dark:hover { background: #2a2d2f; border-color: #2a2d2f; }
  a.pill--fiverr { background: #1dbf73; border-color: #1dbf73; color: #fff; }
  a.pill--fiverr:hover { background: #19a463; border-color: #19a463; }
  a.pill--linkedin i { color: #0a66c2; }

  .contact-cta a.pill, .contact-cta a.pill:visited, .contact-cta a.pill:hover { color: #3d4144; text-decoration: none; }
  .page__content a.pill--dark, .page__content a.pill--dark:visited, .page__content a.pill--dark:hover,
  .page__content a.pill--fiverr, .page__content a.pill--fiverr:visited, .page__content a.pill--fiverr:hover,
  .contact-cta a.pill--fiverr, .contact-cta a.pill--fiverr:visited, .contact-cta a.pill--fiverr:hover,
  .contact-cta a.pill--dark, .contact-cta a.pill--dark:visited, .contact-cta a.pill--dark:hover { color: #fff; }
  /* Single review quotes (Hire Me page) and the quote in the sidebar block */
  .review-quote { max-width: 44em; margin: 1.5em 0; }
  .review-quote p { font-size: 0.95em; font-style: italic; }
  /* Rotating review quotes in the sidebar block: slides share one grid cell so the height never jumps */
  .review-carousel { margin: 0.5em 0 0.6em; }
  .review-carousel__track { display: grid; }
  .author__urls .review-carousel__slide { grid-area: 1 / 1; margin: 0; font-size: 0.8rem; font-style: italic; color: #494e52; opacity: 0; visibility: hidden; transition: opacity 0.6s ease, visibility 0.6s; }
  .author__urls .review-carousel__slide.is-active { opacity: 1; visibility: visible; }

  .review-carousel__dots { display: flex; align-items: center; gap: 7px; margin-top: 0.6em; }
  .author__urls a.review-carousel__dot { display: block; margin: 0; width: 8px; height: 8px; padding: 0; border: 0; border-radius: 50%; background: #c9eedb; cursor: pointer; }

  @media (prefers-reduced-motion: reduce) { .author__urls .review-carousel__slide { transition: none; } }
  /* Sidebar never gets its own scrollbar: if it is taller than the window it scrolls with the page instead of sticking (see script below) */
  @media (min-width: 64em) {
    .sidebar.sticky { overflow-y: visible; max-height: none; }
    .sidebar.sticky.sidebar--static { position: static; }
  }
  /* "34 reviews" links to the Fiverr profile, where that total is shown */
  a.reviews-link, a.reviews-link:visited { color: inherit; text-decoration: underline; text-decoration-color: rgba(0,0,0,0.3); text-underline-offset: 2px; }
  a.reviews-link:hover { color: #138a52; text-decoration-color: currentColor; }
  .author__urls a.reviews-link { display: inline; margin: 0; padding: 0; }
  /* Previous / next sample or game, in grid order (_includes/post_pagination.html) */
  .doc-pager { clear: both; display: grid; grid-template-columns: 1fr 1fr; gap: 1em; margin: 2em 0 1em; }
  a.doc-pager__link { display: flex; flex-direction: column; gap: 0.2em; padding: 0.9em 1.1em; border: 1px solid #e6e6e6; border-radius: 6px; color: #3d4144; text-decoration: none; transition: border-color 0.15s, background 0.15s; }
  a.doc-pager__link:hover { border-color: #1dbf73; background: #f7f9f8; text-decoration: none; }
  a.doc-pager__link--next { text-align: right; grid-column: 2; }
  .doc-pager__label { font-size: 0.75em; color: #6f777d; text-transform: uppercase; letter-spacing: 0.04em; }
  .doc-pager__title { font-weight: bold; font-size: 0.95em; }
  @media (max-width: 599px) { .doc-pager { grid-template-columns: 1fr; } a.doc-pager__link--next { grid-column: 1; } }
</style>
<script>
  (function () {
    function fit() {
      var list = document.querySelectorAll(".sidebar.sticky");
      for (var i = 0; i < list.length; i++) {
        list[i].classList.toggle("sidebar--static", list[i].scrollHeight > window.innerHeight - 64);
      }
    }
    document.addEventListener("DOMContentLoaded", fit);
    window.addEventListener("load", fit);
    window.addEventListener("resize", fit);
  })();
</script>
